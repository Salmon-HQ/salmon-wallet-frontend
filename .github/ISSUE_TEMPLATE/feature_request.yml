name: Feature request
description: Propose an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is painful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you solve it? Rough ideas welcome.
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which app(s)
      multiple: true
      options:
        - Web
        - Mobile
        - Browser extension
        - All / shared logic
