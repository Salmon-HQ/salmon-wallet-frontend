# Weekly, grouped: one PR per ecosystem per week instead of a PR per package.
# Security updates are not limited by these groups — GitHub raises them as
# soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Cooldown: a freshly published version waits before being proposed, so a
    # compromised release gets caught by the ecosystem before it reaches a
    # wallet PR (zizmor dependabot-cooldown).
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Majors need a human decision in a wallet; they arrive as separate PRs.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
