# Weekly, grouped: one PR per ecosystem per week instead of a PR per package.
# Security updates are not limited by these groups — GitHub raises them as
# soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Updates land on staging first, the integration branch; main only moves
    # when staging ships.
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Cooldown: a freshly published version waits before being proposed, so a
    # compromised release gets caught by the ecosystem before it reaches a
    # wallet PR (zizmor dependabot-cooldown).
    cooldown:
      default-days: 7
    # A dependency joins the first group it matches, so the two narrow groups
    # come first.
    groups:
      # Packages with native code change the mobile binary: the native
      # fingerprint check fails until the app version moves (AGENTS.md). On
      # their own PR they are decided with a store release, and stop holding
      # back everything else.
      native:
        patterns: ['expo*', '@expo/*', '*react-native*', '@react-native*', '@solana-mobile/*']
        update-types: [minor, patch]
      # What builds and signs transactions gets its own PR and a security
      # read; `@solana-program/*` is on 0.x, where a minor may break.
      solana:
        patterns: ['@solana/*', '@solana-program/*']
        update-types: [minor, patch]
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Majors need a human decision in a wallet; they arrive as separate PRs.
    ignore:
      # Expo SDK owns these versions (`npx expo install --check`
      # in apps/mobile lists the expected ones). Bumping them out of
      # band breaks the native build silently; they move only in a deliberate
      # SDK migration.
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-worklets
      - dependency-name: react-native-screens
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-svg
      - dependency-name: react-native-gesture-handler
      - dependency-name: '@react-native-async-storage/async-storage'
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: expo*
        update-types: [version-update:semver-major]
      # jest is pinned by jest-expo; it moves with the SDK, not on its own.
      - dependency-name: jest
        update-types: [version-update:semver-major]
      - dependency-name: '@types/jest'
        update-types: [version-update:semver-major]
      # @types/node tracks the Node runtime major (.nvmrc); a newer major types
      # APIs the runtime does not have.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # react-i18next 17 requires i18next >= 26; both majors move together in
      # a deliberate migration.
      - dependency-name: react-i18next
        update-types: [version-update:semver-major]
      - dependency-name: i18next
        update-types: [version-update:semver-major]
      # @testing-library/react-native 14 makes render/fireEvent async and
      # replaces react-test-renderer with the new test-renderer peer — a test
      # suite migration, not a bump.
      - dependency-name: '@testing-library/react-native'
        update-types: [version-update:semver-major]
      # 7.1 enables React Compiler-backed rules the codebase does not pass
      # yet; upgrade deliberately together with the rule fixes.
      - dependency-name: eslint-plugin-react-hooks
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    # Same wait as npm: an action release is proposed once it is 7 days old.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
