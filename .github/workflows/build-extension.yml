name: Build Extension

# Builds the Chrome + Firefox extension packages and the full-repo source
# archive, then uploads them as downloadable artifacts. Triggered by pushing
# an `extension/v*` release tag (the normal path — the tag must match
# apps/extension/package.json), or manually via workflow_dispatch.
# It does NOT publish to any store — a human downloads the artifacts and
# uploads them to the Chrome Web Store / AMO. No store secrets required.
# A tag run also publishes a GitHub Release carrying the same zips, the
# source archive and a SHA256SUMS file, so a build stays downloadable and
# verifiable after the 30-day artifact retention.
#
# To automate publishing later (continuous + approval gate), add a `wxt submit`
# step guarded by a GitHub Environment with required reviewers, plus the store
# API secrets (CHROME_* / FIREFOX_*).

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'extension/v*'

permissions: {}

# Two tags pushed close together must not race on one artifact name.
concurrency:
  group: build-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # On tag-triggered runs, refuse to build if the tag does not match the
      # extension's package.json version — a mismatched tag means the wrong
      # commit was tagged, and the zips would carry a misleading version.
      - name: Check tag matches extension version
        if: startsWith(github.ref, 'refs/tags/extension/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#extension/v}"
          PKG_VERSION="$(jq -r .version apps/extension/package.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag extension/v${TAG_VERSION} does not match apps/extension/package.json version ${PKG_VERSION}"
            exit 1
          fi

      # A tag on a commit CI never passed does not ship. The PR gate runs on
      # main after the merge, so the commit under the tag has a run to check.
      - name: Check CI passed on the tagged commit
        if: startsWith(github.ref, 'refs/tags/extension/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion --jq '[.[] | .conclusion] | if index("success") then "success" else (.[0] // "none") end')"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI has not passed on $GITHUB_SHA (last conclusion: $CONCLUSION) — merge it green before tagging"
            exit 1
          fi

      # pnpm/action-setup reads the pinned version from package.json#packageManager
      # and avoids `corepack enable`, whose bundled keys fail signature
      # verification on Node 22.12.0 in CI.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # No dependency cache: this workflow builds release artifacts, and a
      # poisoned cache written by an untrusted run must not feed a release.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning] -- setup-node does not cache unless `cache:` is set, and it is not
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Output dir is apps/extension/dist (wxt.config sets outDir: 'dist').
      - name: Build + zip Chrome (MV3)
        run: |
          pnpm --filter @salmon/extension build:prod
          pnpm --filter @salmon/extension zip

      - name: Build Firefox (MV2)
        run: pnpm --filter @salmon/extension build:firefox:prod

      # Mozilla's source review rebuilds the extension on Ubuntu and compares
      # byte-for-byte against the submitted zip. Rebuild and diff hashes here
      # so any nondeterminism fails this workflow instead of the AMO review.
      - name: Verify Firefox build is deterministic
        run: |
          (cd apps/extension/dist/firefox-mv2 && find . -type f -exec sha256sum {} \; | sort) > /tmp/ff-1.sha256
          pnpm --filter @salmon/extension build:firefox:prod
          (cd apps/extension/dist/firefox-mv2 && find . -type f -exec sha256sum {} \; | sort) > /tmp/ff-2.sha256
          if ! diff /tmp/ff-1.sha256 /tmp/ff-2.sha256; then
            echo "::error::Firefox build is not deterministic — AMO source review would fail"
            exit 1
          fi

      # Mozilla's own linter, the one AMO runs on upload. An error here is a
      # rejected submission there; catching it costs a minute, not a version.
      - name: Lint Firefox build (web-ext)
        run: npx --yes web-ext@10.6.0 lint --source-dir apps/extension/dist/firefox-mv2 --warnings-as-errors=false

      - name: Zip Firefox (MV2)
        run: pnpm --filter @salmon/extension zip:firefox

      # The wxt-generated *-sources.zip only contains apps/extension and is NOT
      # buildable for this pnpm monorepo (wxt-dev/wxt#2075). Use the full-repo
      # archive for AMO source review instead.
      - name: Pack full-repo source (for AMO)
        run: pnpm pack:sources

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salmon-extension-${{ github.sha }}
          path: |
            apps/extension/dist/*-chrome.zip
            apps/extension/dist/*-firefox.zip
            salmon-wallet-source.zip
          if-no-files-found: error
          retention-days: 30

  # Tag runs only. Its own job so the build keeps `contents: read`; only the
  # publish step holds the write scope, and only for the tag that triggered it.
  release:
    if: startsWith(github.ref, 'refs/tags/extension/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Build provenance: a signed statement that these zips came out of this
      # workflow at this commit. Verify with `gh attestation verify <zip> --repo <owner/repo>`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salmon-extension-${{ github.sha }}
          path: release

      # The artifact keeps the build's directory layout, so the browser zips
      # arrive under apps/extension/dist/ while the source zip sits at the top.
      # Every step below globs `*.zip` at the top, so bring them all there.
      - name: Flatten the artifact
        working-directory: release
        run: find . -mindepth 2 -type f -name '*.zip' -exec mv -t . {} + && ls -1 *.zip
      - name: Checksums
        working-directory: release
        run: |
          find . -maxdepth 1 -type f -name '*.zip' -exec sha256sum {} \; | sed 's#\./##' | sort > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: release/*.zip

      # The same attestation as a file next to the zips, so a download can be
      # verified offline (`gh attestation verify <zip> --bundle <file> --owner Salmon-HQ`)
      # and the release reads as signed to anyone checking the assets.
      - name: Attach the attestation bundle to the release assets
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: cp "$BUNDLE" "release/salmon-extension-${TAG#extension/v}.sigstore.json"

      # Release notes are the tag's section of CHANGELOG.md — the prose written
      # for users — falling back to the PR list when the section is missing.
      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#extension/v}"
          awk -v v="$VERSION" '/^## extension / { on = ($3 == v); next } on' CHANGELOG.md > release/NOTES.md
          if [ -s release/NOTES.md ]; then echo "notes from CHANGELOG.md"; else echo "no CHANGELOG section for $VERSION, using generated notes"; fi

      # --verify-tag refuses to create a release for a tag that is not on the
      # remote; --generate-notes lists the PRs since the previous tag.
      - name: Publish GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -s NOTES.md ]; then NOTES=(--notes-file NOTES.md); else NOTES=(--generate-notes); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${NOTES[@]}" \
            --title "Extension ${TAG#extension/v}" \
            ./*.zip ./SHA256SUMS ./*.sigstore.json
