# PR checks: everything deterministic runs here, before any reviewer looks.
# Spec: specs/008-ci-pr-checks/spec.md
#
# Security model (public repo, fork PRs): plain `pull_request` only — fork
# runs get no secrets by construction. Top-level permissions are empty and
# each job grants itself the minimum. All actions are pinned to full SHAs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: typecheck / lint / test / i18n
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Turbo's local cache, keyed per commit and restored from the newest
      # prior run: a package whose inputs did not change replays its
      # typecheck/lint/test result instead of re-running it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm format:check

      # test:coverage, not test: every package carries a coverage floor in its
      # vitest/jest config (a ratchet — set just under the measured value, only
      # ever raised), so a PR that drops below fails here.
      - name: Typecheck, lint (zero warnings), test with coverage floor
        run: pnpm turbo run typecheck lint test:coverage

      # Typecheck does not exercise the bundler: a deleted barrel or a bad
      # entrypoint import only surfaces in `wxt build`. Cheap, and it is what
      # the release workflow runs.
      - name: Extension builds (chrome-mv3)
        run: pnpm --filter @salmon/extension build

      # Same reason for mobile: Metro resolves imports the type checker never
      # sees. Exports the iOS bundle to a scratch dir and keeps nothing.
      - name: Mobile bundles (Metro)
        run: pnpm --filter @salmon/mobile export:check

      # The OTA guard (apps/mobile/AGENTS.md): when the native surface has
      # moved since the last built binary, expo.version must have moved too,
      # or an update would reach binaries that cannot run it.
      - name: Native fingerprint vs last binary
        run: pnpm check:fingerprint

      - name: i18n parity (en/es keys, orphans)
        run: node scripts/check-i18n.mjs

      # The extension is the mobile app on the DOM (spec 028): live-mode tokens
      # only, one twin per kit component, one contract per pair, one DOM screen
      # per mobile route. Strict since 2026-09-02; the script's own fixtures
      # run first so the gate cannot silently stop catching things.
      - name: DOM parity (extension = mobile on the DOM)
        run: |
          node --test scripts/check-dom-parity.test.mjs
          node scripts/check-dom-parity.mjs

  pr-title:
    name: conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Squash-merge policy makes the PR title the commit on main; this
      # replaces commitlint-on-commits entirely.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            perf
            ci

  zizmor:
    name: workflow security lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
