name: Deploy Web

# Builds the production web app and deploys it to S3 + CloudFront.
#
# Required setup (one-time, in GitHub repo settings):
#   Secrets:
#     AWS_DEPLOY_ROLE_ARN  – ARN of an IAM role this repo can assume via OIDC,
#                            with s3:PutObject/DeleteObject/ListBucket on the
#                            bucket and cloudfront:CreateInvalidation on the
#                            distribution. (Preferred over long-lived keys.)
#   The role's trust policy must allow GitHub's OIDC provider and restrict
#   `sub` to this repo's prod tags and main branch:
#     repo:<org>/<repo>:ref:refs/tags/web/v*   (tag deploys)
#     repo:<org>/<repo>:ref:refs/heads/main    (workflow_dispatch)
#   Variables (repo settings -> Secrets and variables -> Actions -> Variables):
#     S3_BUCKET                   – target S3 bucket for the built site
#     CLOUDFRONT_DISTRIBUTION_ID  – distribution to invalidate after upload
env:
  AWS_REGION: us-east-1
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

on:
  push:
    tags:
      - web/v*
  workflow_dispatch: {}

# Never run two web deploys at once; cancel superseded runs.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Installs the pnpm version pinned in package.json#packageManager.
      # Avoids `corepack enable`, whose bundled signing keys are stale on
      # Node 22.12.0 and fail pnpm signature verification in CI.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 # zizmor: ignore[cache-poisoning] -- v4 does not cache unless `cache:` is set, and it is not
        with:
          node-version-file: .nvmrc
          # No dependency cache on purpose: this workflow publishes to prod,
          # and a poisoned cache entry could reach the artifact (zizmor
          # cache-poisoning). Slower install is the accepted cost.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web (production)
        run: pnpm --filter @salmon/web build:prod

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Vite content-hashes everything under assets/, so those files are
      # immutable and safe to cache for a year. Upload them first.
      - name: Sync hashed assets (immutable)
        run: |
          aws s3 sync apps/web/dist/assets/ "s3://${S3_BUCKET}/assets/" \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

      # Everything else (index.html, fonts, images, favicon) keeps its name
      # across deploys, so it must revalidate instead of being cached forever.
      - name: Sync remaining files (revalidate)
        run: |
          aws s3 sync apps/web/dist/ "s3://${S3_BUCKET}/" \
            --exclude "assets/*" \
            --cache-control "public,max-age=0,must-revalidate" \
            --delete

      # Only the app shell needs invalidating; hashed assets never collide.
      - name: Invalidate CloudFront (app shell)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/' '/index.html'
