# E2E suites, deliberately OFF the PR critical path (spec: specs/011-e2e-ci-and-prerelease).
# Runs nightly on main, on demand, and on PRs that opt in with the `e2e` label.
# Same security posture as ci.yml: pull_request only (no secrets for forks),
# empty top-level permissions, SHA-pinned actions.
#
# No backend in CI (decision D3): backend-dependent specs skip by contract.
# Maestro (mobile) is a local pre-release gate (decision D4) — see
# docs/QA-RUNBOOK.md.
name: E2E

on:
  schedule:
    - cron: '17 6 * * *' # nightly, 06:17 UTC (off the top of the hour — GH load spikes)
  workflow_dispatch:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions: {}

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extension:
    name: extension (playwright, chromium headless)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Only the nightly writes: it files one tracking issue when it fails.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter @salmon/extension exec playwright install chromium --with-deps

      - name: Build extension (chrome-mv3)
        run: pnpm --filter @salmon/extension build

      # Not a copy of .env.test.example: the example ships CHANGE_ME
      # placeholders, and a *set* seed key (even garbage) defeats the specs'
      # skip guards. The devnet seeds and addresses are repo secrets; with
      # them the seed-gated specs run, without them they skip cleanly.
      - name: Write test env
        working-directory: apps/extension/.playwright
        env:
          SALMON_TEST_SEED_A: ${{ secrets.SALMON_TEST_SEED_A }}
          SALMON_TEST_SEED_B: ${{ secrets.SALMON_TEST_SEED_B }}
          SALMON_TEST_WALLET_A_ADDR: ${{ secrets.SALMON_TEST_WALLET_A_ADDR }}
          SALMON_TEST_WALLET_B_ADDR: ${{ secrets.SALMON_TEST_WALLET_B_ADDR }}
        # A key is written only when its secret is set: an empty value would
        # defeat the specs' skip guards. Fork PRs get no secrets, so they
        # keep running the smoke subset.
        run: |
          printf 'SALMON_TEST_PASSWORD=CiSmoke-Pass1!\n' > .env.test
          for key in SALMON_TEST_SEED_A SALMON_TEST_SEED_B SALMON_TEST_WALLET_A_ADDR SALMON_TEST_WALLET_B_ADDR; do
            eval "value=\${$key}"
            [ -n "$value" ] && printf '%s=%s\n' "$key" "$value" >> .env.test
          done
          cut -d= -f1 .env.test

      - name: Run extension E2E headless
        env:
          SALMON_E2E_HEADLESS: '1'
        run: pnpm --filter @salmon/extension e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-playwright-report
          path: apps/extension/.playwright/playwright-report
          retention-days: 7

      # A red nightly used to be visible only to whoever opened the Actions
      # tab: it stayed red for 18 nights in a row once. Now one open issue
      # tracks it — created on the first failure, appended on the next ones,
      # closed by hand when the run is green again.
      - name: File or update the nightly tracking issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='Nightly extension E2E is failing'
          BODY="Scheduled run failed: $RUN_URL (report attached to the run)."
          NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
