<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="manifest.exclude" content="['safari']" />
    <title>Salmon Wallet</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* The first paint is deep water; once the theme provider writes the
         `--sw-*` tokens the ground follows the mode (the panel's ground is
         the water ramp's floor, as mobile's tab shell). */
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        background-color: var(--sw-water-gradient-1, #0f0f0f);
        color: var(--sw-text-primary);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
