appId: io.salmonwallet.app
---
# Recover Wallet A → add Account 2 from the Wallets screen → remove it from
# Settings → Accounts. Full account lifecycle on a clean install.
#
# Add and remove live on two different screens by design: Wallets is where a
# wallet is chosen, renamed and added (CORE 10); removing one is a destructive
# action and stays in Settings → Accounts, next to the other destructive rows.
- runFlow: ../../../subflows/onboard-walletA.yaml
# Open the Wallets screen
- tapOn:
    id: 'wallet-header-account-switcher'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'wallets-screen'
- assertVisible:
    id: 'wallets-add-wallet'
- takeScreenshot: screenshots/actions/account/wallets-before-add
# Add Account 2
- tapOn:
    id: 'wallets-add-wallet'
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible: 'Add Account'
- tapOn:
    id: 'account-add-method-derive'
# Wait for the scan to actually render a row. "Scanning for accounts" can be
# absent for a beat before the list appears, so keying off its disappearance
# taps into an empty screen.
- extendedWaitUntil:
    visible: '.*Solana.*SOL'
    timeout: 90000
# Select the derived row by its accessibility text (address + path + balance).
# A point tap at the checkbox misses and leaves Continue disabled.
- tapOn: '.*Solana.*SOL'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'account-add-derive-continue-button'
- extendedWaitUntil:
    visible: 'Account Name'
    timeout: 20000
# Confirm
- tapOn: 'Confirm'
- waitForAnimationToEnd:
    timeout: 15000
# Back on Wallets, with the new wallet active.
- extendedWaitUntil:
    visible:
      id: 'wallets-screen'
    timeout: 30000
# The row's accessibility text is "Account 2, <short address>", and Maestro
# full-matches, so a bare "Account 2" never matches.
- assertVisible: 'Account 2, .*'
- takeScreenshot: screenshots/actions/account/account-2-added
# Remove it from Settings → Accounts.
- tapOn:
    id: 'screen-header-back-button'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../../../subflows/open-accounts-panel.yaml
- tapOn:
    id: 'account-remove-.*'
- extendedWaitUntil:
    visible: 'Delete Account?'
    timeout: 5000
- assertVisible: 'Yes, remove'
- tapOn: 'Yes, remove'
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: 'Account 2, .*'
- takeScreenshot: screenshots/actions/account/account-2-removed
