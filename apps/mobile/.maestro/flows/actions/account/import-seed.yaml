appId: io.salmonwallet.app
---
# Add an account by IMPORTING an external seed phrase (Wallet B) into an
# existing wallet. Complements add-and-remove.yaml, which covers the other
# AccountAddPanel branch (deriving a new account from the active seed).
#
# The distinction matters beyond UI: a derived account is a "create", an
# imported seed is a "recover", and the two emit different analytics events.
- runFlow: ../../../subflows/onboard-walletA.yaml
- tapOn:
    id: 'wallet-header-account-switcher'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'wallets-screen'
- tapOn:
    id: 'wallets-add-wallet'
- extendedWaitUntil:
    visible:
      id: 'account-add-method-import'
    timeout: 10000
- tapOn:
    id: 'account-add-method-import'
- extendedWaitUntil:
    visible:
      id: 'account-add-seed-word-input-1'
    timeout: 10000
- tapOn:
    id: 'account-add-seed-word-input-1'
- inputText: ${SALMON_TEST_SEED_B}
- waitForAnimationToEnd:
    timeout: 2000
# The first tap after inputText lands on the keyboard dismissal, so drive
# Continue until the name step is reached.
- tapOn:
    id: 'account-add-seed-continue-button'
- runFlow:
    when:
      notVisible: 'Account Name'
    commands:
      - tapOn:
          id: 'account-add-seed-continue-button'
- extendedWaitUntil:
    visible: 'Account Name'
    timeout: 25000
- takeScreenshot: screenshots/actions/account/import-seed-name
- tapOn: 'Confirm'
- waitForAnimationToEnd:
    timeout: 30000
# `returnTo=wallets` lands the finished flow back on the Wallets screen.
- extendedWaitUntil:
    visible:
      id: 'wallets-screen'
    timeout: 30000
- takeScreenshot: screenshots/actions/account/import-seed-added
