appId: io.salmonwallet.app
---
# Switch the ACTIVE account between two wallets.
#
# smoke/mobile/wallet-switcher.yaml only opens and closes the Wallets screen —
# it never selects a different wallet, so the actual switch path (which changes
# persistent state) had no coverage. This flow adds a second wallet, then
# switches back to the first.
- runFlow: ../../../subflows/onboard-walletA.yaml

# --- Add a derived wallet; it becomes the active one ---
- tapOn:
    id: 'wallet-header-account-switcher'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'wallets-screen'
- tapOn:
    id: 'wallets-add-wallet'
- extendedWaitUntil:
    visible:
      id: 'account-add-method-derive'
    timeout: 10000
- tapOn:
    id: 'account-add-method-derive'
- extendedWaitUntil:
    visible: '.*Solana.*SOL'
    timeout: 90000
- tapOn: '.*Solana.*SOL'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'account-add-derive-continue-button'
- extendedWaitUntil:
    visible: 'Account Name'
    timeout: 20000
- tapOn: 'Confirm'
- waitForAnimationToEnd:
    timeout: 15000
# `returnTo=wallets`: a flow opened from Wallets lands back on Wallets with the
# new wallet already active.
- extendedWaitUntil:
    visible:
      id: 'wallets-screen'
    timeout: 30000

# --- Switch back to Account #1 ---
# Row accessibility text is exactly "Account #1" (the active row reads
# "Account 2, active"), and Maestro full-matches.
- tapOn: 'Account #1'
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: 'wallet-header-account-switcher'
    timeout: 25000
- takeScreenshot: screenshots/actions/account/switched-back-to-1
