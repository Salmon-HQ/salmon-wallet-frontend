appId: io.salmonwallet.app
---
# Send the devnet fixture NFT from Wallet A to Wallet B. A real transfer, on
# devnet only: the flow switches to Solana devnet and refuses to start anywhere
# else.
#
# One way, on purpose. The fixture ("Salmon Test NFT") is minted to Wallet A by
# scripts/devnet-fixtures.cjs, which run.sh calls before every run: a transfer
# moves it to B, and the next run finds none in A and mints another. Nothing
# depends on getting it back.
- runFlow: ../../../subflows/onboard-walletA.yaml
- runFlow: ../../../subflows/select-devnet.yaml
- takeScreenshot: screenshots/actions/nft/nft-walletA-home
- runFlow:
    file: ../../../subflows/send-nft.yaml
    env:
      DEST_ADDRESS: ${MAESTRO_SALMON_TEST_WALLET_B_ADDR}
- takeScreenshot: screenshots/actions/nft/nft-sent-to-walletB
