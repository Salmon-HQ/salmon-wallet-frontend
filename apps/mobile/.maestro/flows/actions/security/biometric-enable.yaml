appId: io.salmonwallet.app
---
# Turn biometric unlock ON from Settings → Security.
#
# The toggle only renders when the device reports biometrics as available AND
# enrolled. On the iOS Simulator that means enrolling first:
#
#   xcrun simctl spawn <UDID> notifyutil -s com.apple.BiometricKit.enrollmentChanged 1
#   xcrun simctl spawn <UDID> notifyutil -p com.apple.BiometricKit.enrollmentChanged
#
# Without enrollment the toggle is absent and this flow fails at the assert —
# that is the intended signal, not a flake.
- runFlow: ../../../subflows/onboard-walletA.yaml
- runFlow: ../../../subflows/open-settings.yaml
- tapOn:
    id: "settings-item-security"
- extendedWaitUntil:
    visible:
      id: "security-biometric-toggle"
    timeout: 10000
- takeScreenshot: screenshots/actions/security/biometric-off
- tapOn:
    id: "security-biometric-toggle"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: screenshots/actions/security/biometric-on
