appId: io.salmonwallet.app
---
# Send 0.001 devnet SOL → Wallet B. Fires a real transaction, on devnet only:
# the flow switches to Solana devnet and refuses to start anywhere else.
#
# Send is four screens now (spec 018), not a sheet with steps: Home pushes the
# recipient screen, Continue pushes the amount screen, Review pushes the
# signature screen, and the receipt replaces it.
- runFlow: ../../../subflows/onboard-walletA.yaml
- runFlow: ../../../subflows/select-devnet.yaml
- runFlow: ../../../subflows/assert-devnet.yaml
- tapOn:
    id: 'home-send-button'
- extendedWaitUntil:
    visible:
      id: 'send-recipient-screen'
    timeout: 20000
# The token lives on this screen now (owner ruling 2026-09-01): the picker
# opens from `send-selected-token`, defaults to the chain's own asset, and
# amount's copy of that row is read-only from here on.
- tapOn:
    id: 'send-selected-token'
- runFlow:
    when:
      visible:
        id: 'send-token-picker'
    commands:
      - runFlow: ../../../subflows/dismiss-bottom-sheet.yaml
- tapOn:
    id: 'send-recipient-input'
- inputText: ${MAESTRO_SALMON_TEST_WALLET_B_ADDR}
# Validation is debounced and hits the RPC; Continue is dead until it answers.
- extendedWaitUntil:
    visible:
      id: 'send-continue-button'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'send-continue-button'
- extendedWaitUntil:
    visible:
      id: 'send-amount-input'
    timeout: 20000
- tapOn:
    id: 'send-amount-input'
- inputText: '0.001'
- waitForAnimationToEnd:
    timeout: 2000
# The token row is a caption now, not a door — the header's tap dismisses the
# numeric keyboard without leaving the screen.
- tapOn:
    id: 'send-amount-screen'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'send-review-button'
- extendedWaitUntil:
    visible:
      id: 'send-confirm-button'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: screenshots/actions/send/send-confirm-screen
- tapOn:
    id: 'send-confirm-button'
- extendedWaitUntil:
    visible:
      id: 'tx-success-continue-button'
    timeout: 60000
- takeScreenshot: screenshots/actions/send/send-success
- tapOn:
    id: 'tx-success-continue-button'
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 30000
- takeScreenshot: screenshots/actions/send/home-after-send
