appId: io.salmonwallet.app
---
# Network choice (spec 045), changing one's mind: choose "Solana only", go back
# from the password, choose "Solana + Bitcoin", and finish. The network screen
# stays mounted under the password screen, so its rows must answer a second
# time, and the second password screen must still hold the phrase (its submit
# button only works with one).
- clearState
- launchApp
- runFlow: ../../../subflows/dev-launcher-pass.yaml
- tapOn:
    id: 'select-recover-button'
- extendedWaitUntil:
    visible:
      id: 'recover-word-input-1'
    timeout: 30000
- runFlow:
    file: ../../../subflows/type-seed.yaml
    env:
      SEED: ${MAESTRO_SALMON_TEST_SEED_A}
      FIELD: 'recover-word-input'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'onboarding-slot-title'
- extendedWaitUntil:
    visible:
      id: 'recover-next-button'
    timeout: 10000
- tapOn:
    id: 'recover-next-button'
- extendedWaitUntil:
    visible:
      id: 'onboarding-networks-screen'
    timeout: 30000
- takeScreenshot: screenshots/smoke/auth/networks-step
- tapOn:
    id: 'onboarding-networks-option-solana-only'
- extendedWaitUntil:
    visible:
      id: 'password-input'
    timeout: 30000
- tapOn:
    id: 'password-back'
- extendedWaitUntil:
    visible:
      id: 'onboarding-networks-option-solana-bitcoin'
    timeout: 30000
- tapOn:
    id: 'onboarding-networks-option-solana-bitcoin'
- extendedWaitUntil:
    visible:
      id: 'password-input'
    timeout: 30000
- tapOn:
    id: 'password-input'
- inputText: ${MAESTRO_SALMON_TEST_PASSWORD}
- runFlow: ../../../subflows/hide-keyboard.yaml
- tapOn:
    id: 'password-confirm-input'
- inputText: ${MAESTRO_SALMON_TEST_PASSWORD}
- runFlow: ../../../subflows/hide-keyboard.yaml
- tapOn:
    id: 'password-submit-button'
# Key derivation takes over 30 s on a cold emulator; the biometric offer or
# Success follows it.
- extendedWaitUntil:
    visible:
      id: 'biometric-skip-button|success-go-to-wallet-button'
    timeout: 90000
- runFlow:
    when:
      visible:
        id: 'biometric-skip-button'
    commands:
      - tapOn:
          id: 'biometric-skip-button'
- extendedWaitUntil:
    visible:
      id: 'success-go-to-wallet-button'
    timeout: 30000
- tapOn:
    id: 'success-go-to-wallet-button'
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: 'analytics-consent-screen'
    file: ../../../subflows/decline-analytics-consent.yaml
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 30000
# "Solana + Bitcoin" was the last answer, so Bitcoin is offered.
- extendedWaitUntil:
    visible:
      id: 'balance-chain-selector-option-bitcoin.*'
    timeout: 30000
