appId: io.salmonwallet.app
---
- clearState
- launchApp
- runFlow: ../../../subflows/dev-launcher-pass.yaml
- runFlow: ../../../subflows/recover-walletA.yaml
# Biometric prompt — simulator has no biometrics by default; auto-skips.
# If biometrics enrolled, take the "Maybe Later" path.
- runFlow:
    when:
      visible:
        id: "biometric-skip-button"
    commands:
      - tapOn:
          id: "biometric-skip-button"
# First-run analytics consent is the final onboarding step. Decline to reach
# the success screen, the same way subflows/onboard-walletA.yaml does. (The
# screen itself is covered by flows/smoke/settings/analytics-prompt.yaml.)
- extendedWaitUntil:
    visible:
      id: "analytics-consent-screen"
    timeout: 30000
- tapOn:
    id: "analytics-consent-decline"
- extendedWaitUntil:
    visible: "Congratulations!"
    timeout: 60000
- takeScreenshot: screenshots/smoke/auth/recover-success
- tapOn:
    id: "success-go-to-wallet-button"
- extendedWaitUntil:
    visible: "Switch wallet account"
    timeout: 30000
- takeScreenshot: screenshots/smoke/auth/home-after-recover
