appId: io.salmonwallet.app
---
- clearState
- launchApp
- runFlow: ../../../subflows/dev-launcher-pass.yaml
- runFlow: ../../../subflows/recover-walletA.yaml
# Biometric prompt — simulator has no biometrics by default; auto-skips.
# If biometrics enrolled, take the "Maybe Later" path.
- runFlow:
    when:
      visible:
        id: 'biometric-skip-button'
    commands:
      - tapOn:
          id: 'biometric-skip-button'
# Success comes first; leaving it presents the first-run analytics consent,
# which is the final onboarding step. Decline it to reach Home, the same way
# subflows/onboard-walletA.yaml does. (The screen itself is covered by
# flows/smoke/settings/analytics-prompt.yaml.)
# Key derivation (PBKDF2, 210k iterations) runs between the password screen and
# Success. It takes over 30s on a cold emulator, so the wait has to outlast it.
- extendedWaitUntil:
    visible: 'Congratulations!'
    timeout: 90000
- takeScreenshot: screenshots/smoke/auth/recover-success
- tapOn:
    id: 'success-go-to-wallet-button'
- runFlow: ../../../subflows/decline-analytics-consent.yaml
- extendedWaitUntil:
    visible: 'Switch wallet account'
    timeout: 30000
- takeScreenshot: screenshots/smoke/auth/home-after-recover
