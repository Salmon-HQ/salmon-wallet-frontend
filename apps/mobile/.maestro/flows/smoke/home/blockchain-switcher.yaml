appId: io.salmonwallet.app
---
# Switch the balance between Solana and Bitcoin with the chain selector above
# the amount.
- runFlow: ../../../subflows/onboard-walletA.yaml
- assertVisible:
    id: 'balance-chain-selector-option-solana.*'
- takeScreenshot: screenshots/smoke/home/chain-solana
- tapOn:
    id: 'balance-chain-selector-option-bitcoin.*'
- extendedWaitUntil:
    visible:
      id: 'balance-chain-selector-option-bitcoin.*'
      selected: true
    timeout: 5000
- takeScreenshot: screenshots/smoke/home/chain-bitcoin
- tapOn:
    id: 'balance-chain-selector-option-solana.*'
- extendedWaitUntil:
    visible:
      id: 'balance-chain-selector-option-solana.*'
      selected: true
    timeout: 5000
- takeScreenshot: screenshots/smoke/home/chain-back-to-solana
