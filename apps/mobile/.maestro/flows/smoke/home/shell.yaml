appId: io.salmonwallet.app
---
# Walk the Home shell that replaced the bottom tab bar: the balance block with
# its eye toggle and money actions, the in-page Portfolio | NFTs sub-tabs, and
# the Powerups FAB with the catalogue it opens.
#
# Read-only: the eye toggle is never tapped (it persists), the sub-tabs only
# change what is drawn, and the catalogue installs nothing. Everything
# is asserted by testID — the labels are localised.
- runFlow: ../../../subflows/onboard-walletA.yaml
- assertVisible:
    id: 'home-screen'
- assertVisible:
    id: 'balance-eye-toggle'
- assertVisible:
    id: 'home-send-button'
- assertVisible:
    id: 'portfolio-tab-portfolio'
- assertVisible:
    id: 'portfolio-tab-nfts'
- assertVisible:
    id: 'powerups-fab'
- takeScreenshot: screenshots/smoke/home/shell-portfolio

# The sub-tabs are offered on every chain; NFTs takes the balance back to
# Solana on its own when it needs to.
- tapOn:
    id: 'portfolio-tab-nfts'
- extendedWaitUntil:
    notVisible:
      id: 'collectibles-loading'
    timeout: 30000
# The sub-tab row stays reachable on the NFTs tab — that is the whole point of
# it sticking rather than scrolling away with the balance.
- assertVisible:
    id: 'portfolio-tab-portfolio'
- takeScreenshot: screenshots/smoke/home/shell-nfts
- tapOn:
    id: 'portfolio-tab-portfolio'
- waitForAnimationToEnd:
    timeout: 5000

# The `+` opens the Powerups catalogue, a sheet over Home. The sheet is its own
# window, so the FAB underneath is out of reach while it is up: close it the
# way a person does, by dragging it down.
- tapOn:
    id: 'powerups-fab'
- extendedWaitUntil:
    visible:
      id: 'powerups-row-toggle-.*'
    timeout: 20000
- takeScreenshot: screenshots/smoke/home/shell-powerups
- runFlow: ../../../subflows/dismiss-bottom-sheet.yaml
- assertNotVisible:
    id: 'powerups-row-toggle-.*'
- assertVisible:
    id: 'powerups-fab'
