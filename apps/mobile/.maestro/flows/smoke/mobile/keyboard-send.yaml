appId: io.salmonwallet.app
---
# Probe the keyboard handling on the send form. Open Send → amount → screenshot.
- runFlow: ../../../subflows/onboard-walletA.yaml
- tapOn:
    id: 'home-send-button'
- extendedWaitUntil:
    visible:
      id: 'send-recipient-screen'
    timeout: 20000
- tapOn:
    id: 'send-recipient-input'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: screenshots/smoke/mobile/send-recipient
- runFlow: ../../../subflows/settings-back.yaml
- assertVisible:
    id: 'wallet-header-account-switcher'
