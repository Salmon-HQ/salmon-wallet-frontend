appId: io.salmonwallet.app
---
# Probe the Wallets screen (tap the identity in the header row).
# It is a pushed stack screen now, not a panel behind the gate: it leaves
# through the back well in its own header, or the system back gesture.
- runFlow: ../../../subflows/onboard-walletA.yaml
- assertVisible:
    id: 'wallet-header-account-switcher'
- tapOn:
    id: 'wallet-header-account-switcher'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'wallets-screen'
- assertVisible:
    id: 'wallets-total-card'
- assertVisible:
    id: 'wallets-add-wallet'
- takeScreenshot: screenshots/smoke/mobile/wallet-switcher
- tapOn:
    id: 'screen-header-back-button'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'wallet-header-account-switcher'
