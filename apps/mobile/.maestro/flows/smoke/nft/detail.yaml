appId: io.salmonwallet.app
---
# Walk Collectibles → open the NFT detail screen → back. On devnet, against the
# fixture NFT ("Salmon Test NFT") that scripts/devnet-nft-fixture.cjs keeps in
# Wallet A — run.sh calls it before every run.
- runFlow: ../../../subflows/onboard-walletA.yaml
- runFlow: ../../../subflows/select-devnet.yaml
- tapOn:
    id: 'portfolio-tab-nfts'
- extendedWaitUntil:
    notVisible:
      id: 'collectibles-loading'
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'nft-card-.*'
      containsDescendants:
        - text: 'Salmon Test NFT'
    timeout: 30000
- tapOn:
    id: 'nft-card-.*'
    containsDescendants:
      - text: 'Salmon Test NFT'
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: 'nft-detail-screen'
- takeScreenshot: screenshots/smoke/nft/detail-fixture
- tapOn:
    id: 'screen-header-back-button'
- extendedWaitUntil:
    visible:
      id: 'portfolio-tab-nfts'
    timeout: 10000
- assertVisible:
    id: 'portfolio-tab-nfts'
- tapOn:
    id: 'portfolio-tab-portfolio'
