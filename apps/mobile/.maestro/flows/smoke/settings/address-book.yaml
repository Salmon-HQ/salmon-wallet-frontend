appId: io.salmonwallet.app
---
- runFlow: ../../../subflows/onboard-walletA.yaml
- runFlow: ../../../subflows/open-settings.yaml
- assertVisible:
    id: 'settings-screen'
- scrollUntilVisible:
    element:
      id: 'settings-item-address-book'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'settings-item-address-book'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: screenshots/smoke/settings/address-book
- runFlow: ../../../subflows/settings-back.yaml
- assertVisible:
    id: 'settings-screen'
