appId: io.salmonwallet.app
---
# First-run anonymous-analytics consent SCREEN (opt-in). It is the final
# onboarding step: biometric-setup → success → analytics-consent → Home.
# Proves the screen appears once during onboarding and that both choices advance
# into the wallet. Companion to analytics.yaml (the Settings toggle).
#
# Does its own onboarding (not onboard-walletA, which auto-declines this screen)
# so it can assert on the screen and drive each button.

# --- Decline path -----------------------------------------------------------
- clearState
- launchApp
- runFlow: ../../../subflows/dev-launcher-pass.yaml
- runFlow: ../../../subflows/recover-walletA.yaml
- runFlow:
    when:
      visible:
        id: 'biometric-skip-button'
    commands:
      - tapOn:
          id: 'biometric-skip-button'
# Success comes first; leaving it presents the consent screen.
- extendedWaitUntil:
    visible: 'Congratulations!'
    timeout: 90000
- tapOn:
    id: 'success-go-to-wallet-button'
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-screen'
    timeout: 30000
- assertVisible:
    id: 'analytics-consent-screen'
- takeScreenshot: screenshots/smoke/settings/analytics-prompt-screen
# The close affordance declines and enters the wallet.
- tapOn:
    id: 'analytics-consent-decline'
- extendedWaitUntil:
    visible: 'Switch wallet account'
    timeout: 30000
- takeScreenshot: screenshots/smoke/settings/analytics-prompt-declined

# --- Accept path (fresh onboarding) -----------------------------------------
- clearState
- launchApp
- runFlow: ../../../subflows/dev-launcher-pass.yaml
- runFlow: ../../../subflows/recover-walletA.yaml
- runFlow:
    when:
      visible:
        id: 'biometric-skip-button'
    commands:
      - tapOn:
          id: 'biometric-skip-button'
- extendedWaitUntil:
    visible: 'Congratulations!'
    timeout: 90000
- tapOn:
    id: 'success-go-to-wallet-button'
- extendedWaitUntil:
    visible:
      id: 'analytics-consent-screen'
    timeout: 30000
# "Compartir datos anónimos" accepts and enters the wallet.
- tapOn:
    id: 'analytics-consent-accept'
- extendedWaitUntil:
    visible: 'Switch wallet account'
    timeout: 30000
- takeScreenshot: screenshots/smoke/settings/analytics-prompt-accepted
