appId: io.salmonwallet.app
---
- runFlow: ../../../subflows/onboard-walletA.yaml
- runFlow: ../../../subflows/open-settings.yaml
- assertVisible:
    id: 'settings-screen'
- tapOn:
    id: 'settings-item-display-currency'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: screenshots/smoke/settings/currency
- runFlow: ../../../subflows/settings-back.yaml
- assertVisible:
    id: 'settings-screen'
