appId: io.salmonwallet.app
---
# Solana dApp Store shots from the Seed Vault wallet, against the staging proxy
# in Seeker mode (STAGING_REGION=seeker stages an SKR stake): the account picker
# (and Seed Vault's own prompt, when it asks) during onboarding, Home, the SKR tab, and Swap
# (swap-shot.yaml, saved as 02-swap). Needs a Seeker emulator whose Seed Vault
# simulator holds the test seed (actions/seed-vault/import-test-seed.yaml) and
# Metro in development mode: only a development build accepts the simulator.
# The onboarding is onboard-with-seed-vault.yaml with the two shots in it.
# capture-seeker-mwa.yaml adds the dApp connect and sign shots.
- clearState
- launchApp
- runFlow: ../../subflows/dev-launcher-pass.yaml
- extendedWaitUntil:
    visible:
      id: 'select-seed-vault-button'
    timeout: 30000
- tapOn:
    id: 'select-seed-vault-button'
- runFlow:
    when:
      visible: 'Allow'
    commands:
      - tapOn: 'Allow'
- runFlow:
    when:
      visible: 'Connection request'
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: ${OUT}/02-seed-vault-prompt
      - runFlow: ../../subflows/seed-vault-confirm.yaml
# Seed Vault lists the seed's accounts on several derivation paths; wallet A's
# (the staged one, with real SOL for the Swap quote) is picked by its address.
- extendedWaitUntil:
    visible:
      id: ${'seed-vault-account-' + MAESTRO_SALMON_TEST_WALLET_A_ADDR}
    timeout: 30000
- tapOn:
    id: ${'seed-vault-account-' + MAESTRO_SALMON_TEST_WALLET_A_ADDR}
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${OUT}/02-seed-vault
- scrollUntilVisible:
    element:
      id: 'seed-vault-next-button'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'seed-vault-next-button'
- extendedWaitUntil:
    visible:
      id: 'password-input'
    timeout: 30000
- tapOn:
    id: 'password-input'
- inputText: ${MAESTRO_SALMON_TEST_PASSWORD}
- runFlow: ../../subflows/hide-keyboard.yaml
- tapOn:
    id: 'password-confirm-input'
- inputText: ${MAESTRO_SALMON_TEST_PASSWORD}
- runFlow: ../../subflows/hide-keyboard.yaml
- tapOn:
    id: 'password-submit-button'
- extendedWaitUntil:
    visible:
      id: 'biometric-skip-button|success-go-to-wallet-button'
    timeout: 90000
- runFlow:
    when:
      visible:
        id: 'biometric-skip-button'
    commands:
      - tapOn:
          id: 'biometric-skip-button'
- extendedWaitUntil:
    visible:
      id: 'success-go-to-wallet-button'
    timeout: 30000
- tapOn:
    id: 'success-go-to-wallet-button'
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: 'analytics-consent-screen'
    file: ../../subflows/decline-analytics-consent.yaml
- extendedWaitUntil:
    visible:
      id: 'token-row-SOL'
    timeout: 60000
- extendedWaitUntil:
    notVisible: 'Refreshing...'
    timeout: 30000

# Payments installed, as on every other deck's Home.
- tapOn:
    id: 'powerups-fab'
- extendedWaitUntil:
    visible:
      id: 'powerups-row-payments'
    timeout: 20000
- tapOn:
    id: 'powerups-row-payments'
- tapOn:
    id: 'powerups-detail-toggle-payments'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../../subflows/dismiss-bottom-sheet.yaml
- extendedWaitUntil:
    visible:
      id: 'portfolio-tab-payments'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${OUT}/01-home

# SKR, offered on a Seeker only.
- tapOn:
    id: 'powerups-fab'
- extendedWaitUntil:
    visible:
      id: 'powerups-row-skr'
    timeout: 20000
- tapOn:
    id: 'powerups-row-skr'
- tapOn:
    id: 'powerups-detail-toggle-skr'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../../subflows/dismiss-bottom-sheet.yaml
- tapOn:
    id: 'portfolio-tab-skr'
- extendedWaitUntil:
    visible:
      id: 'skr-screen'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${OUT}/05-skr

- runFlow: swap-shot.yaml
