appId: io.salmonwallet.app
---
# The store shots from an unlocked Home with nothing installed, against the
# staging proxy (store-assets/staging): the balance, history and NFTs are the
# staged account's, prices and the Swap quote are live. Entered through
# capture.yaml (fresh install + onboarding).
#
# Nothing here signs: the Swap shot stops on the review and leaves by its back
# button; the send shot stops on Review.
# ----------------------------------------------------------- the two tabs --
- extendedWaitUntil:
    visible:
      id: 'token-row-SOL'
    timeout: 60000
- extendedWaitUntil:
    notVisible: 'Refreshing...'
    timeout: 30000
# Home carries Payments, never Swap, so the same Home serves the App Store
# U.K. set, whose listing must not show Swap. A row is one accessible element
# on iOS, so its switch is out of reach: install from the Powerup's detail.
- tapOn:
    id: 'powerups-fab'
- extendedWaitUntil:
    visible:
      id: 'powerups-row-payments'
    timeout: 20000
- tapOn:
    id: 'powerups-row-payments'
- tapOn:
    id: 'powerups-detail-toggle-payments'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../../subflows/dismiss-bottom-sheet.yaml

# ----------------------------------------------------------------- 01 home --
- extendedWaitUntil:
    visible:
      id: 'portfolio-tab-payments'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${OUT}/01-home

# ------------------------------------------------------------- 03 powerups --
- tapOn:
    id: 'powerups-fab'
- extendedWaitUntil:
    visible:
      id: 'powerups-row-swap'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${OUT}/03-powerups
- runFlow: ../../subflows/dismiss-bottom-sheet.yaml

# ------------------------------------------------------------- 04 payments --
- tapOn:
    id: 'portfolio-tab-payments'
- extendedWaitUntil:
    visible:
      id: 'payments-ask-button'
    timeout: 20000
- tapOn:
    id: 'payments-ask-button'
- extendedWaitUntil:
    visible:
      id: 'payments-amount-input'
    timeout: 20000
- tapOn:
    id: 'payments-amount-input'
- inputText: '25'
- tapOn:
    id: 'payments-amount-fiat'
- tapOn:
    id: 'payments-create'
- extendedWaitUntil:
    visible:
      id: 'payments-sheet-qr'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${OUT}/04-payments
- runFlow: ../../subflows/dismiss-bottom-sheet.yaml
- tapOn:
    id: 'portfolio-tab-portfolio'

# ----------------------------------------------------------------- 05 send --
- tapOn:
    id: 'home-send-button'
- extendedWaitUntil:
    visible:
      id: 'send-recipient-screen'
    timeout: 20000
- tapOn:
    id: 'send-recipient-input'
- inputText: 'salmonwallet.sns'
- extendedWaitUntil:
    visible:
      id: 'send-continue-button'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'send-continue-button'
- extendedWaitUntil:
    visible:
      id: 'send-amount-input'
    timeout: 20000
- tapOn:
    id: 'send-amount-input'
- inputText: '0.5'
- tapOn:
    id: 'send-amount-fiat'
- tapOn:
    id: 'send-review-button'
- extendedWaitUntil:
    visible:
      id: 'send-review-screen'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${OUT}/05-send
- runFlow: ../../subflows/settings-back.yaml
- runFlow: ../../subflows/settings-back.yaml
- runFlow: ../../subflows/settings-back.yaml
- extendedWaitUntil:
    visible:
      id: 'wallet-header-account-switcher'
    timeout: 20000

# ----------------------------------------------------------------- 06 nfts --
- tapOn:
    id: 'portfolio-tab-nfts'
- extendedWaitUntil:
    visible:
      id: 'nft-card-.*'
      containsDescendants:
        - text: 'Salmon Run #1'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: ${OUT}/06-nfts
- tapOn:
    id: 'portfolio-tab-portfolio'

# ---------------------------------------------------------- 07 token detail --
# The U.K. set's second frame, in place of Swap.
- tapOn:
    id: 'token-row-SOL'
- extendedWaitUntil:
    visible:
      id: 'token-detail-screen'
    timeout: 30000
- extendedWaitUntil:
    visible: 'Market data'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: ${OUT}/07-token-info

# ----------------------------------------------------------------- 02 swap --
# Last, so no earlier shot shows a Swap tab (the U.K. set reuses them).
# 0.01 SOL: within what the demo wallet really holds, which is all the
# backend will quote. Review is reached and left; it is never confirmed.
- tapOn:
    id: 'powerups-fab'
- extendedWaitUntil:
    visible:
      id: 'powerups-row-swap'
    timeout: 20000
- tapOn:
    id: 'powerups-row-swap'
- tapOn:
    id: 'powerups-detail-toggle-swap'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../../subflows/dismiss-bottom-sheet.yaml
- tapOn:
    id: 'portfolio-tab-swap'
- extendedWaitUntil:
    visible:
      id: 'swap-amount-input'
    timeout: 30000
- tapOn:
    id: 'swap-amount-input'
- inputText: '0.01'
- tapOn:
    id: 'swap-amount-fiat'
- tapOn:
    id: 'swap-submit-button'
# The quote expires within a minute and the button turns into Refresh Quote:
# shoot as soon as the review has settled.
- extendedWaitUntil:
    visible:
      id: 'confirmation-details-card'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${OUT}/02-swap
- tapOn:
    id: 'confirmation-back-button'
- extendedWaitUntil:
    visible:
      id: 'swap-amount-input'
    timeout: 20000
