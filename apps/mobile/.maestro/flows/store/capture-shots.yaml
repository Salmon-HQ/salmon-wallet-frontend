appId: io.salmonwallet.app
---
# The six store shots from an unlocked Home (Wallet A). Entered through
# capture.yaml (fresh install + onboarding) or capture-home.yaml (already
# logged in, app left as it is).
# ----------------------------------------------------------------- 01 home --
- extendedWaitUntil:
    visible:
      id: 'token-row-SOL'
    timeout: 60000
# The dev client's "Refreshing..." banner rides over the header for a few
# seconds after launch; the shot waits it out.
- extendedWaitUntil:
    notVisible: 'Refreshing...'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${OUT}/01-home

# ----------------------------------------------------------------- 02 send --
- tapOn:
    id: 'home-send-button'
- extendedWaitUntil:
    visible:
      id: 'send-recipient-screen'
    timeout: 20000
- tapOn:
    id: 'send-recipient-input'
- inputText: 'toly.sol'
- extendedWaitUntil:
    visible:
      id: 'send-continue-button'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'send-continue-button'
- extendedWaitUntil:
    visible:
      id: 'send-amount-input'
    timeout: 20000
- tapOn:
    id: 'send-amount-input'
# Within the test wallet's balance, so "Review send" is enabled in the shot.
- inputText: '0.01'
- waitForAnimationToEnd:
    timeout: 5000
# Dismiss the keyboard without leaving the screen. `hideKeyboard` is wrong
# here: on Android it back-presses and pops the screen; on iOS it errors out.
# The ScrollView is keyboardShouldPersistTaps="handled", so a tap on the fiat
# readout closes the keyboard and leaves the form on screen.
- tapOn:
    id: 'send-amount-fiat'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/02-send
- runFlow: ../../subflows/settings-back.yaml
- runFlow: ../../subflows/settings-back.yaml
- extendedWaitUntil:
    visible:
      id: 'wallet-header-account-switcher'
    timeout: 20000

# --------------------------------------------------------- 03 transactions --
- tapOn:
    id: 'home-activity-button'
- extendedWaitUntil:
    visible:
      id: 'activity-screen'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: ${OUT}/03-transactions
- runFlow: ../../subflows/settings-back.yaml
- extendedWaitUntil:
    visible:
      id: 'wallet-header-account-switcher'
    timeout: 20000

# --------------------------------------------------------- 04 collectibles --
# Mindfolk Founder #5154 is the one NFT the test wallet genuinely holds.
- tapOn:
    id: 'portfolio-tab-nfts'
- extendedWaitUntil:
    visible:
      id: 'nft-card-CNM8WMZvQ15baEV1r4QEW1MPR3xwaotattgtA4abnDmV'
    timeout: 40000
# Artwork is a public-CDN fetch; a cold emulator needs the long wait or the
# tile ships as a flat placeholder with no error.
- waitForAnimationToEnd:
    timeout: 45000
- takeScreenshot: ${OUT}/04-collectibles

# ----------------------------------------------------------- 05 nft detail --
- tapOn:
    id: 'nft-card-CNM8WMZvQ15baEV1r4QEW1MPR3xwaotattgtA4abnDmV'
- extendedWaitUntil:
    visible: 'Mindfolk Founder #5154'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 45000
- takeScreenshot: ${OUT}/05-nft-detail
# The NFT detail is a pushed screen. `back` is Android's hardware key; iOS
# has none, so it leaves by the header's own button there.
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'screen-header-back-button'
- extendedWaitUntil:
    visible:
      id: 'nft-card-CNM8WMZvQ15baEV1r4QEW1MPR3xwaotattgtA4abnDmV'
    timeout: 20000
- tapOn:
    id: 'portfolio-tab-portfolio'

# ---------------------------------------------------------- 06 token detail --
- extendedWaitUntil:
    visible:
      id: 'token-row-SOL'
    timeout: 30000
- tapOn:
    id: 'token-row-SOL'
# The detail is open once the market card has painted (the chain's own coin
# has no contract row, so that is not the cue).
- extendedWaitUntil:
    visible:
      id: 'token-detail-screen'
    timeout: 30000
- extendedWaitUntil:
    visible: 'Market data'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: ${OUT}/06-token-info
