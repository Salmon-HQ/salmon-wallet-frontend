appId: io.salmonwallet.app
---
# TEMPORARY store-screenshot capture flow (not part of the test suite).
# Runs against the staged mock backend; ${OUT} is an absolute output dir.
- runFlow: ../../subflows/onboard-walletA.yaml

# ----------------------------------------------------------------- 01 home --
- extendedWaitUntil:
    visible:
      id: 'token-row-SOL'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${OUT}/01-home

# ----------------------------------------------------------------- 02 send --
- tapOn:
    id: 'home-send-button'
- extendedWaitUntil:
    visible: 'Select Token'
    timeout: 20000
- tapOn:
    id: 'send-token-row-SOL'
- extendedWaitUntil:
    visible:
      id: 'send-recipient-input'
    timeout: 20000
- tapOn:
    id: 'send-recipient-input'
- inputText: 'toly.sol'
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: 'send-amount-input'
- inputText: '2.5'
- waitForAnimationToEnd:
    timeout: 5000
# Dismiss the keyboard by tapping the "Amount" label. `hideKeyboard` is wrong
# here: on Android it back-presses, the bottom sheet consumes it, and the shot
# lands on Home; on iOS it errors out. The form's ScrollView is
# keyboardShouldPersistTaps="handled", so a tap on a non-interactive label
# closes the keyboard and leaves the sheet — and Review & Send — on screen.
- tapOn: 'Amount'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/02-send
- runFlow: ../../subflows/dismiss-bottom-sheet.yaml
- runFlow: ../../subflows/dismiss-bottom-sheet.yaml
- extendedWaitUntil:
    visible:
      id: 'wallet-header-account-switcher'
    timeout: 20000

# --------------------------------------------------------- 03 transactions --
- tapOn:
    id: 'home-activity-button'
- extendedWaitUntil:
    visible:
      id: 'activity-screen'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${OUT}/03-transactions
- runFlow: ../../subflows/settings-back.yaml
- extendedWaitUntil:
    visible:
      id: 'wallet-header-account-switcher'
    timeout: 20000

# --------------------------------------------------------- 04 collectibles --
- tapOn:
    id: 'portfolio-tab-nfts'
- extendedWaitUntil:
    visible: 'My Collectibles'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'nft-card-J1S9H3QjnRtBbbuD4HjPV6RpRhwuk4zKbxsnCHuTgh9w'
    timeout: 40000
# Artwork is fetched from public CDNs; give every tile time to decode. The Mad
# Lads source PNG is ~9 MB, and on a cold emulator 20s is not enough — the tile
# renders as a flat placeholder colour and the shot is silently wrong.
- waitForAnimationToEnd:
    timeout: 45000
- takeScreenshot: ${OUT}/04-collectibles

# ----------------------------------------------------------- 05 nft detail --
- tapOn:
    id: 'nft-card-J1S9H3QjnRtBbbuD4HjPV6RpRhwuk4zKbxsnCHuTgh9w'
- extendedWaitUntil:
    visible: 'Mad Lads #8420'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: ${OUT}/05-nft-detail
- runFlow: ../../subflows/dismiss-bottom-sheet.yaml
- extendedWaitUntil:
    visible: 'My Collectibles'
    timeout: 20000
- tapOn:
    id: 'portfolio-tab-portfolio'

# ----------------------------------------------------------- 06 token info --
- extendedWaitUntil:
    visible:
      id: 'token-row-SOL'
    timeout: 30000
- tapOn:
    id: 'token-row-SOL'
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: ${OUT}/06-token-info
