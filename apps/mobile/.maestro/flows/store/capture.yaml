appId: io.salmonwallet.app
---
# TEMPORARY store-screenshot capture flow (not part of the test suite).
# Runs against the staged mock backend; ${OUT} is an absolute output dir.
- runFlow: ../../subflows/onboard-walletA.yaml

# ----------------------------------------------------------------- 01 home --
- extendedWaitUntil:
    visible:
      id: 'token-row-SOL'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${OUT}/01-home

# ----------------------------------------------------------------- 02 send --
- tapOn:
    id: 'home-send-button'
- extendedWaitUntil:
    visible:
      id: 'send-recipient-screen'
    timeout: 20000
- tapOn:
    id: 'send-recipient-input'
- inputText: 'toly.sol'
- extendedWaitUntil:
    visible:
      id: 'send-continue-button'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'send-continue-button'
- extendedWaitUntil:
    visible:
      id: 'send-amount-input'
    timeout: 20000
- tapOn:
    id: 'send-amount-input'
- inputText: '2.5'
- waitForAnimationToEnd:
    timeout: 5000
# Dismiss the keyboard without leaving the screen. `hideKeyboard` is wrong
# here: on Android it back-presses and pops the screen; on iOS it errors out.
# The ScrollView is keyboardShouldPersistTaps="handled", so a tap on the fiat
# readout closes the keyboard and leaves the form on screen.
- tapOn:
    id: 'send-amount-fiat'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/02-send
- runFlow: ../../subflows/settings-back.yaml
- runFlow: ../../subflows/settings-back.yaml
- extendedWaitUntil:
    visible:
      id: 'wallet-header-account-switcher'
    timeout: 20000

# --------------------------------------------------------- 03 transactions --
- tapOn:
    id: 'home-activity-button'
- extendedWaitUntil:
    visible:
      id: 'activity-screen'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${OUT}/03-transactions
- runFlow: ../../subflows/settings-back.yaml
- extendedWaitUntil:
    visible:
      id: 'wallet-header-account-switcher'
    timeout: 20000

# --------------------------------------------------------- 04 collectibles --
- tapOn:
    id: 'portfolio-tab-nfts'
- extendedWaitUntil:
    visible: 'My Collectibles'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'nft-card-J1S9H3QjnRtBbbuD4HjPV6RpRhwuk4zKbxsnCHuTgh9w'
    timeout: 40000
# Artwork is fetched from public CDNs; give every tile time to decode. The Mad
# Lads source PNG is ~9 MB, and on a cold emulator 20s is not enough — the tile
# renders as a flat placeholder colour and the shot is silently wrong.
- waitForAnimationToEnd:
    timeout: 45000
- takeScreenshot: ${OUT}/04-collectibles

# ----------------------------------------------------------- 05 nft detail --
- tapOn:
    id: 'nft-card-J1S9H3QjnRtBbbuD4HjPV6RpRhwuk4zKbxsnCHuTgh9w'
- extendedWaitUntil:
    visible: 'Mad Lads #8420'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: ${OUT}/05-nft-detail
# The NFT detail is a pushed screen now (spec 019 D7), not a bottom sheet:
# it leaves by the platform back, not by dragging a handle.
- back
- extendedWaitUntil:
    visible: 'My Collectibles'
    timeout: 20000
- tapOn:
    id: 'portfolio-tab-portfolio'

# ------------------------------------------------ 06 token detail (screen) --
# Was a sheet; the row now pushes `/token/[id]` (spec 019), so this capture is
# a screen, not a modal — nothing to dismiss afterward.
- extendedWaitUntil:
    visible:
      id: 'token-row-SOL'
    timeout: 30000
- tapOn:
    id: 'token-row-SOL'
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: ${OUT}/06-token-info
