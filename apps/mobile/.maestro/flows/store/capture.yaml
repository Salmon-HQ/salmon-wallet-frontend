appId: io.salmonwallet.app
---
# Store-screenshot capture flow (not part of the test suite). Runs against the
# backend `apps/mobile/.env` names; ${OUT} is an absolute output dir. One flow,
# seven captures: home, send, transactions, collectibles, nft detail, token
# detail, about. Swap left the deck on 2026-09-03 (the powerups surface is
# closed for the submission).
- runFlow: ../../subflows/onboard-walletA.yaml

# ----------------------------------------------------------------- 01 home --
- extendedWaitUntil:
    visible:
      id: 'token-row-SOL'
    timeout: 60000
# The dev client's "Refreshing..." banner rides over the header for a few
# seconds after launch; the shot waits it out.
- extendedWaitUntil:
    notVisible: 'Refreshing...'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${OUT}/01-home

# ----------------------------------------------------------------- 02 send --
- tapOn:
    id: 'home-send-button'
- extendedWaitUntil:
    visible:
      id: 'send-recipient-screen'
    timeout: 20000
- tapOn:
    id: 'send-recipient-input'
- inputText: 'toly.sol'
- extendedWaitUntil:
    visible:
      id: 'send-continue-button'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'send-continue-button'
- extendedWaitUntil:
    visible:
      id: 'send-amount-input'
    timeout: 20000
- tapOn:
    id: 'send-amount-input'
# Within the test wallet's balance, so "Review send" is enabled in the shot.
- inputText: '0.01'
- waitForAnimationToEnd:
    timeout: 5000
# Dismiss the keyboard without leaving the screen. `hideKeyboard` is wrong
# here: on Android it back-presses and pops the screen; on iOS it errors out.
# The ScrollView is keyboardShouldPersistTaps="handled", so a tap on the fiat
# readout closes the keyboard and leaves the form on screen.
- tapOn:
    id: 'send-amount-fiat'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/02-send
- runFlow: ../../subflows/settings-back.yaml
- runFlow: ../../subflows/settings-back.yaml
- extendedWaitUntil:
    visible:
      id: 'wallet-header-account-switcher'
    timeout: 20000

# --------------------------------------------------------- 03 transactions --
- tapOn:
    id: 'home-activity-button'
- extendedWaitUntil:
    visible:
      id: 'activity-screen'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: ${OUT}/03-transactions
- runFlow: ../../subflows/settings-back.yaml
- extendedWaitUntil:
    visible:
      id: 'wallet-header-account-switcher'
    timeout: 20000

# --------------------------------------------------------- 04 collectibles --
# Mindfolk Founder #5154 is the one NFT the test wallet genuinely holds.
- tapOn:
    id: 'portfolio-tab-nfts'
- extendedWaitUntil:
    visible:
      id: 'nft-card-CNM8WMZvQ15baEV1r4QEW1MPR3xwaotattgtA4abnDmV'
    timeout: 40000
# Artwork is a public-CDN fetch; a cold emulator needs the long wait or the
# tile ships as a flat placeholder with no error.
- waitForAnimationToEnd:
    timeout: 45000
- takeScreenshot: ${OUT}/04-collectibles

# ----------------------------------------------------------- 05 nft detail --
- tapOn:
    id: 'nft-card-CNM8WMZvQ15baEV1r4QEW1MPR3xwaotattgtA4abnDmV'
- extendedWaitUntil:
    visible: 'Mindfolk Founder #5154'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 45000
- takeScreenshot: ${OUT}/05-nft-detail
# The NFT detail is a pushed screen: it leaves by the platform back.
- back
- extendedWaitUntil:
    visible:
      id: 'nft-card-CNM8WMZvQ15baEV1r4QEW1MPR3xwaotattgtA4abnDmV'
    timeout: 20000
- tapOn:
    id: 'portfolio-tab-portfolio'

# ---------------------------------------------------------- 06 token detail --
- extendedWaitUntil:
    visible:
      id: 'token-row-SOL'
    timeout: 30000
- tapOn:
    id: 'token-row-SOL'
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: ${OUT}/06-token-info
- runFlow: ../../subflows/settings-back.yaml
- extendedWaitUntil:
    visible:
      id: 'wallet-header-account-switcher'
    timeout: 20000

# ---------------------------------------------------------------- 07 about --
- runFlow: ../../subflows/open-settings.yaml
- scrollUntilVisible:
    element:
      text: 'About'
    direction: DOWN
    timeout: 20000
- tapOn: 'About'
- extendedWaitUntil:
    visible:
      id: 'about-link-github'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${OUT}/07-about
