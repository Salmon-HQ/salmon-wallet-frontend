appId: io.salmonwallet.app
---
# expo-dev-launcher intercepts after clearState/launch. Load JS bundle, then dismiss any
# auto-shown dev menu before yielding to caller.
- runFlow:
    when:
      visible: "Development Build"
    commands:
      # The DEVELOPMENT SERVERS row is labelled with the packager URL, not the
      # app name — "Salmon Wallet" is the header above it, so keying off that
      # text taps nothing and the bundle never loads.
      - tapOn: "http://.*:8081"
      # Bundle download takes 5-30s on cold launch.
      - waitForAnimationToEnd:
          timeout: 60000
- runFlow:
    when:
      visible: "Fast refresh"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "Welcome"
    timeout: 60000
