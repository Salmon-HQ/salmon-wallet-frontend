appId: io.salmonwallet.app
---
# Get past expo-dev-launcher to the app's first screen. A release build has no
# launcher, so every step is guarded.
#
# The dev menu itself never shows: plugins/withQuietDevMenu.js turns off its
# launch sheet and floating button in the build, and run.sh refuses a build
# without it.
#
# The SDK 57 launcher lists the local Metro only when it can discover it on the
# network: some runs show a `http://<lan-ip>:8081` row, others an empty list.
# Tap the row when there is one; if the launcher is still up afterwards, open
# the bundle by the dev client's deep link on localhost (adb reverse maps it on
# Android, the simulator shares it on iOS).
- runFlow:
    when:
      visible: 'Development Build'
    commands:
      - tapOn:
          text: 'http://.*:8081'
          optional: true
      - waitForAnimationToEnd:
          timeout: 60000
- runFlow:
    when:
      visible: 'Development Build'
    commands:
      - openLink: 'salmonwallet://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
      - waitForAnimationToEnd:
          timeout: 60000

# The door shows the wordmark, not a "Welcome" heading (spec 013/022).
- extendedWaitUntil:
    visible:
      id: 'welcome-screen'
    timeout: 60000
