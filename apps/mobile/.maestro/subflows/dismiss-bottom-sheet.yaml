appId: io.salmonwallet.app
---
# Dismiss the open bottom sheet the way a user does on both platforms: drag
# its handle down. A sheet behind a nested one hides its own handle from
# accessibility, so the id always names the top sheet.
- swipe:
    from:
      id: 'sheet-drag-handle'
    direction: DOWN
- extendedWaitUntil:
    notVisible:
      id: 'sheet-drag-handle'
    timeout: 5000
