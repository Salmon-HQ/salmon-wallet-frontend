appId: io.salmonwallet.app
---
# Onboard Wallet A from a clean install. Lands on Home with
# `home-screen` visible.
- clearState
- launchApp
- runFlow: ./dev-launcher-pass.yaml
- runFlow: ./recover-walletA.yaml
# Key derivation (PBKDF2, 210k iterations) runs after the password screen and
# takes over 30 s on a cold emulator. What follows it is either the biometric
# offer or Success: wait for whichever comes, then skip biometrics if offered.
# Checking for the offer before derivation ends finds nothing, and the offer
# then covers Success for good.
- extendedWaitUntil:
    visible:
      id: 'biometric-skip-button|success-go-to-wallet-button'
    timeout: 90000
- runFlow:
    when:
      visible:
        id: 'biometric-skip-button'
    commands:
      - tapOn:
          id: 'biometric-skip-button'
- extendedWaitUntil:
    visible:
      id: 'success-go-to-wallet-button'
    timeout: 30000
- tapOn:
    id: 'success-go-to-wallet-button'
# Let the transition settle before asking what is on screen.
- waitForAnimationToEnd:
    timeout: 5000
# Consent is asked once per install and not on every build (a release build
# without analytics skips it), so it is handled when it appears.
- runFlow:
    when:
      visible:
        id: 'analytics-consent-screen'
    file: ./decline-analytics-consent.yaml
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 30000
