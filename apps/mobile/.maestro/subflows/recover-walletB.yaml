appId: io.salmonwallet.app
---
# Recover Wallet B — fresh install path. Caller must launchApp/clearState first.
- assertVisible: 'Salmon'
- assertVisible:
    id: 'select-recover-button'
- tapOn:
    id: 'select-recover-button'
# The phrase is typed one word per box now. Typing the whole phrase into the
# first box is a paste as far as the grid is concerned: it splits on
# whitespace and fills every box at once.
- extendedWaitUntil:
    visible:
      id: 'recover-word-input-1'
    timeout: 30000
- tapOn:
    id: 'recover-word-input-1'
- inputText: ${MAESTRO_SALMON_TEST_SEED_B}
# Dismiss keyboard by tapping the title.
- tapOn: 'Recover Existing Account'
- extendedWaitUntil:
    visible:
      id: 'recover-next-button'
    timeout: 10000
- tapOn:
    id: 'recover-next-button'
- extendedWaitUntil:
    visible:
      id: 'password-input'
    timeout: 30000
- tapOn:
    id: 'password-input'
- inputText: ${MAESTRO_SALMON_TEST_PASSWORD}
- tapOn: 'Choose a Password'
- tapOn:
    id: 'password-confirm-input'
- inputText: ${MAESTRO_SALMON_TEST_PASSWORD}
- tapOn: 'Choose a Password'
# Tapping the title does not close the Android keyboard, and a tap while it
# is open only dismisses it: close it first so Submit is pressed.
- hideKeyboard
- tapOn:
    id: 'password-submit-button'
