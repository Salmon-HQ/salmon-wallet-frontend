appId: io.salmonwallet.app
---
# Send the NFT with mint ${NFT_MINT} from the ACTIVE account to ${DEST_ADDRESS}.
# Fires a real on-chain transfer and dismisses the success screen.
#
#   - runFlow:
#       file: ../../../subflows/send-nft.yaml
#       env:
#         NFT_MINT: CNM8...
#         DEST_ADDRESS: ${SALMON_TEST_WALLET_B_ADDR}
#
# Starts from Home and leaves the app on the in-page NFTs sub-tab: the
# receipt's Continue dismisses the whole NFT sub-stack back to it.
#
# Do not declare an `env:` defaults block in this file. Maestro lets the default
# win over the value passed by `runFlow`, and the selector silently degrades to
# `nft-card-` with an empty mint.
#
# Cards are tapped by their mint-derived testID (`nft-card-<mint>`), never by
# name: Maestro full-matches text, and the test wallets hold phishing airdrops
# whose names are padded with zero-width spaces.
- tapOn:
    id: 'portfolio-tab-nfts'
- extendedWaitUntil:
    visible: 'My Collectibles'
    timeout: 20000
# Generous timeout: right after a transfer the DAS index needs a moment before
# it reports the new owner, so the card can take a while to show up.
- extendedWaitUntil:
    visible:
      id: 'nft-card-${NFT_MINT}'
    timeout: 120000
- tapOn:
    id: 'nft-card-${NFT_MINT}'
- waitForAnimationToEnd:
    timeout: 6000
# The detail is a pushed screen now (spec 019 D7). Send and Burn sit on the
# fixed bottom band, so they are on screen from the moment it mounts — no
# scroll needed to reach them.
- tapOn:
    id: 'nft-detail-send-button'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'send-recipient-input'
- inputText: ${DEST_ADDRESS}
- hideKeyboard
# The validator debounces 500ms before Continue goes live.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'nft-send-continue-button'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'nft-send-confirm-button'
- extendedWaitUntil:
    visible: 'NFT sent'
    timeout: 120000
# Continue stays disabled while settlement invalidates and refetches the
# balance and NFT queries, so a tap that lands during settling is swallowed and
# the receipt stays up — breaking whatever runs next. Retry until it is gone.
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            visible:
              id: 'tx-success-continue-button'
          commands:
            - tapOn:
                id: 'tx-success-continue-button'
            - waitForAnimationToEnd:
                timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: 'tx-success-continue-button'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
