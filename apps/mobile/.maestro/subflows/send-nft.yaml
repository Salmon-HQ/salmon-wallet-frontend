appId: io.salmonwallet.app
---
# Send the devnet fixture NFT ("Salmon Test NFT", kept in Wallet A by
# scripts/devnet-nft-fixture.cjs) from the ACTIVE account to ${DEST_ADDRESS}.
# Fires a real transfer on devnet and dismisses the success screen.
#
#   - runFlow:
#       file: ../../../subflows/send-nft.yaml
#       env:
#         DEST_ADDRESS: ${MAESTRO_SALMON_TEST_WALLET_B_ADDR}
#
# Starts from Home and leaves the app on the in-page NFTs sub-tab: the
# receipt's Continue dismisses the whole NFT sub-stack back to it.
#
# Do not declare an `env:` defaults block in this file. Maestro lets the default
# win over the value passed by `runFlow`.
- runFlow: ./assert-devnet.yaml
- tapOn:
    id: 'portfolio-tab-nfts'
- extendedWaitUntil:
    notVisible:
      id: 'collectibles-loading'
    timeout: 20000
# The fixture card, found by the name it carries rather than a mint: each run
# may hold a freshly minted one.
- extendedWaitUntil:
    visible:
      id: 'nft-card-.*'
      containsDescendants:
        - text: 'Salmon Test NFT'
    timeout: 120000
- tapOn:
    id: 'nft-card-.*'
    containsDescendants:
      - text: 'Salmon Test NFT'
    index: 0
- waitForAnimationToEnd:
    timeout: 6000
# The detail is a pushed screen now (spec 019 D7). Send and Burn sit on the
# fixed bottom band, so they are on screen from the moment it mounts — no
# scroll needed to reach them.
- tapOn:
    id: 'nft-detail-send-button'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'send-recipient-input'
- inputText: ${DEST_ADDRESS}
- hideKeyboard
# The validator debounces 500ms before Continue goes live.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'nft-send-continue-button'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'nft-send-confirm-button'
- extendedWaitUntil:
    visible:
      id: 'tx-success-continue-button'
    timeout: 120000
# Continue stays disabled while settlement invalidates and refetches the
# balance and NFT queries, so a tap that lands during settling is swallowed and
# the receipt stays up — breaking whatever runs next. Retry until it is gone.
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            visible:
              id: 'tx-success-continue-button'
          commands:
            - tapOn:
                id: 'tx-success-continue-button'
            - waitForAnimationToEnd:
                timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: 'tx-success-continue-button'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
